{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Burgrs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --black: #0B0B0B; --dark-gray: #1A1A1A; --yellow: #F5A623; --white: #FFFFFF; }
        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--dark-gray);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .btn-primary { background: var(--yellow); border: none; color: var(--black); font-weight: 700; }
        .btn-primary:hover { background: #E6951A; }
        .form-control { background: var(--black); border: 1px solid #333; color: white; }
        a { color: var(--yellow); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">🍔 Login</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3"><small>No account? <a href="{% url 'register' %}">Register here</a></small></p>
    </div>
</body>
</html>
