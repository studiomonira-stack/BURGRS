{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgrs Sarajevo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0B0B0B;
            --dark-gray: #1A1A1A;
            --yellow: #F5A623;
            --white: #FFFFFF;
            --light-gray: #CCCCCC;
        }
        body {
    background: var(--black);
    color: var(--white);
    font-family: 'Archivo', sans-serif;
 }

h1, h2, h3, .navbar-brand {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
}
        .navbar {
            background: var(--black) !important;
            border-bottom: 1px solid #222;
        }
        .navbar-brand {
            color: var(--yellow) !important;
            font-size: 1.8rem;
        }
        .btn-primary {
            background: var(--yellow);
            border: none;
            color: var(--black);
            font-weight: 700;
            border-radius: 8px;
            padding: 12px 24px;
        }
        .btn-primary:hover {
            background: #E6951A;
            color: var(--black);
        }
        .card {
            background: var(--dark-gray);
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
        }
        .card img {
            height: 200px;
            object-fit: cover;
        }
        .card h5 {
            font-family: 'Archivo', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
        }
        .price {
            color: var(--yellow);
            font-weight: 700;
            font-size: 1.2rem;
        }
        .hero {
            padding: 80px 0;
            text-align: center;
        }
        .hero h1 {
            font-size: 4rem;
            color: var(--yellow);
        }
        .card h5, .card h2, .card h3, .card h4 {
    color: var(--white) !important;
}
.card p {
    color: var(--light-gray);
}
/* Knappar - mjuk hover */
.btn {
    transition: all 0.2s ease;
}
.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3);
}

/* Kort - lyft-effekt */
.card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(245, 166, 35, 0.15);
}

/* Badge - pulserande glow */
.badge {
    transition: box-shadow 0.3s ease;
}
.badge:hover {
    box-shadow: 0 0 12px rgba(245, 166, 35, 0.5);
}

/* Länkar - mjuk färgskiftning */
a {
    transition: color 0.2s ease;
}

/* Hamburgermeny-ikon - lite roligare */
.navbar-toggler {
    transition: transform 0.2s ease;
}
.navbar-toggler:hover {
    transform: rotate(90deg);
}
.btn-outline-warning {
    border-color: var(--yellow);
    color: var(--yellow);
    transition: all 0.2s ease;
}
.btn-outline-warning:hover {
    background: var(--yellow);
    color: var(--black);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3);
}
button {
    cursor: pointer;
}
.btn-outline-warning {
    cursor: pointer;
}
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-expand-lg px-4">
    <a class="navbar-brand" href="/">
        <img src="{% static 'images/Burgrs-sarajevo-ny-logga-2.webp' %}" alt="Burgrs" height="40">
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
        <div class="ms-auto">
            <a href="{% url 'nyheter' %}" class="btn btn-outline-light btn-sm me-2 d-block d-lg-inline-block mb-1 mb-lg-0">News</a>
            <a href="{% url 'hem' %}" class="btn btn-outline-light btn-sm me-2 d-block d-lg-inline-block mb-1 mb-lg-0">Menu</a>
            <a href="{% url 'erbjudanden' %}" class="btn btn-outline-warning btn-sm me-2 d-block d-lg-inline-block mb-1 mb-lg-0">Offers</a>
                       <a href="{% url 'youmatter' %}" class="btn btn-outline-warning btn-sm me-2 d-block d-lg-inline-block mb-1 mb-lg-0">You Matter</a>
            
                    {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-warning btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'account_login' %}" class="btn btn-outline-warning btn-sm d-block d-lg-inline-block">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
